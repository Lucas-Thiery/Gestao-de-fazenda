<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AgroCiclo</title>
</head>

<body>

    <div class="divisao">
        <div class="ladoEsquerdo">
            <p>Lado esquedo-foto</p>
        </div>

        <div class="ladoDireito">
            <div class="cadastro">
                <h2>Cadastro do proprietário</h2>
                <p>Primeiro acesso ao AgroCiclo.</p>

                <h1>Seus dados</h1>
                <label>completo:
                    <input type="text" placeholder="Digite o seu nome">
                </label>
                <label>E-mail:
                    <input type="text" placeholder="nome@exemplo.com">
                </label>

                <h1>Acesso</h1>
                <label>Senha:
                    <input type="password" placeholder="Crie uma senha">
                </label>
                
                <label>Confirmar senha:
                    <input type="password" placeholder="Confirme a sua senha">
                    <!-- <p> de 8 carateres, com letras e números</p> -->
                </label>

                <button type="submit" class="botaoC">Cadastrar</button>

                <label class="entrar">
                    Já tem conta? <a href="pagina de login">Entrar</a>
                </label>
    
            </div>

        </div>
    </div>

</body>

</html>
